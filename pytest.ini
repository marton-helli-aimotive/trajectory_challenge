[pytest]
# Pytest configuration for trajectory prediction system

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Slow running tests
    api: API tests
    model: Model tests
    data: Data tests
    
# Test paths
testpaths = tests

# Minimum version
minversion = 6.0

# Add source to Python path
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    --durations=10
    --disable-warnings
    -p no:cacheprovider
    
# Async testing
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src
omit = 
    tests/*
    */test_*
    */__init__.py
    */conftest.py
    
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov