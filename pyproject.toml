[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-prediction"
version = "0.1.0"
description = "Advanced Vehicle Trajectory Prediction Pipeline"
authors = [
    {name = "Trajectory Challenge", email = "challenge@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pyarrow>=10.0.0",
    "duckdb>=0.9.0",
    "numpy>=1.24.0",
    
    # Geospatial and trajectory analysis
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "folium>=0.15.0",
    
    # Machine learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.4.0",
    "shap>=0.43.0",
    
    # Deep learning and probabilistic models
    "torch>=2.0.0",
    "gpytorch>=1.11.0",
    
    # Async processing
    "aiohttp>=3.9.0",
    "asyncio-throttle>=1.0.2",
    "aiofiles>=23.0.0",
    
    # Data validation and configuration
    "pydantic>=2.5.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    
    # Visualization and dashboard
    "plotly>=5.17.0",
    "dash>=2.14.0",
    "streamlit>=1.28.0",
    "altair>=5.1.0",
    
    # MLOps and monitoring
    "mlflow>=2.8.0",
    "evidently>=0.4.0",
    "wandb>=0.16.0",
    
    # API and serving
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic-settings>=2.1.0",
    
    # Testing and quality
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.88.0",
    "mypy>=1.6.0",
    
    # Utilities
    "loguru>=0.7.0",
    "typer>=0.9.0",
    "rich>=13.6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

distributed = [
    "dask[complete]>=2023.10.0",
    "ray[default]>=2.7.0",
]

gpu = [
    "cupy-cuda11x>=12.0.0",
    "cuml>=23.10.0",
]

[project.scripts]
trajectory-predict = "trajectory_prediction.cli:main"
trajectory-dashboard = "trajectory_prediction.dashboard.app:main"
trajectory-serve = "trajectory_prediction.serving.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/trajectory_prediction",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]