# Default configuration for Vehicle Trajectory Prediction System

# Environment settings
environment: development
debug: false

# Data configuration
data:
  raw_data_path: data/raw
  processed_data_path: data/processed
  features_data_path: data/features
  cache_dir: data/cache
  
  # Dataset configuration
  dataset_name: ngsim
  dataset_url: null
  dataset_format: csv
  
  # Processing configuration
  batch_size: 1000
  num_workers: 4
  chunk_size: 10000
  
  # Storage configuration
  storage_format: parquet
  compression: snappy
  partitioning: [date]

# Model configuration
model:
  # Model types to use
  models: [cv, ca, polynomial, knn, gaussian_process, ensemble]
  
  # Training configuration
  train_test_split: 0.8
  validation_split: 0.2
  random_state: 42
  
  # Prediction configuration
  prediction_horizon: 30
  prediction_frequency: 0.1
  
  # Model-specific configurations
  cv_config: {}
  ca_config: {}
  polynomial_config:
    degree: 3
    features: [position, velocity, acceleration]
  knn_config:
    n_neighbors: 5
    weights: uniform
  gaussian_process_config:
    kernel: rbf
    alpha: 1.0e-6
  ensemble_config:
    method: voting
    weights: null

# Feature configuration
features:
  # Feature extraction
  velocity_features: true
  acceleration_features: true
  curvature_features: true
  lane_change_features: true
  spatial_features: true
  temporal_features: true
  
  # Feature engineering parameters
  window_size: 10
  min_trajectory_length: 20
  max_trajectory_length: 1000
  
  # Data augmentation
  enable_augmentation: true
  noise_std: 0.1
  interpolation_method: linear
  
  # Feature store
  feature_store_enabled: true
  feature_cache_size: 1000

# Evaluation configuration
evaluation:
  # Metrics to compute
  metrics: [rmse, ade, fde, min_distance, ttc, lateral_error]
  
  # Cross-validation
  cv_folds: 5
  cv_strategy: time_series
  
  # Statistical testing
  statistical_tests: [wilcoxon, mann_whitney]
  confidence_level: 0.95
  
  # Performance benchmarking
  benchmark_inference_speed: true
  benchmark_memory_usage: true
  num_benchmark_runs: 100

# Logging configuration
logging:
  level: INFO
  format: json
  include_timestamp: true
  include_process_id: true
  include_thread_id: true
  
  # File logging
  log_to_file: true
  log_file_path: logs/app.log
  max_file_size: 104857600  # 100MB
  backup_count: 5

# MLOps configuration
mlops:
  # MLflow configuration
  mlflow_enabled: true
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_registry_uri: sqlite:///mlflow.db
  mlflow_experiment_name: trajectory_prediction
  
  # Model serving
  model_serving_enabled: true
  serving_host: 0.0.0.0
  serving_port: 8000
  serving_workers: 4
  
  # Monitoring
  monitoring_enabled: true
  drift_detection_enabled: true
  monitoring_interval: 3600